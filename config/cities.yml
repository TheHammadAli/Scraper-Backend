# ---------------------------------------------------------------------------
# Target cities.
#
# This file is the ONLY place cities are defined - nothing is hard-coded in the
# scrapers. Add a city by appending a block, remove one by deleting it or
# setting `enabled: false`.
#
# Per-site identifiers:
#   olx_location_id  - OLX's numeric location id. Leave null and it is resolved
#                      automatically on first run, then cached in
#                      .cache/locations.json.
#   zameen_slug      - Zameen's "<City>-<id>" path segment. Leave null to
#                      auto-resolve and cache the same way.
#   pakwheels_slug   - PakWheels uses a plain lowercase city slug in its URLs,
#                      so this is derived from `name` unless overridden here.
#
# Auto-resolved values are looked up live and cached - never guessed. If a
# lookup fails, that city is skipped for that source with a warning rather
# than silently collecting the wrong location.
# ---------------------------------------------------------------------------

