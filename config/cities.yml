# ---------------------------------------------------------------------------
# City overrides.
#
# The list of cities itself lives in pakistan_cities.json (270 cities across
# Punjab, Sindh, Khyber Pakhtunkhwa, Balochistan, Islamabad, Gilgit-Baltistan
# and Azad Kashmir). It is generated - do not edit it by hand:
#
#     python scripts/build_pakistan_cities.py --probe-pakwheels
#
# That script merges GeoNames with the location lists OLX and Zameen publish,
# so every city in it is one at least one of the sites really has.
#
# Nothing needs to be listed here. Use this file only to change how a city
# behaves. An entry is matched to a city by name or alias (any spelling).
#
#   cities:
#     - name: Chakwal
#       enabled: false            # hide it from the picker and from runs
#
#     - name: Mingora
#       olx_location_id: "4060641"   # pin OLX's numeric id instead of looking it up
#       zameen_slug: Mingora-13476   # pin Zameen's "<Name>-<id>"
#       pakwheels_slug: mingora      # pin PakWheels' ct_<slug>
#       aliases: [Mingaora, Saidu Sharif]   # extra names the search should find
#
#     - name: Some New Town          # not in the master list -> added as a city
#       province: Punjab
#
# Identifiers are normally resolved from each site's own data at run time and
# never guessed, so pin one only if a site's data is wrong for that city.
# ---------------------------------------------------------------------------

cities: []
